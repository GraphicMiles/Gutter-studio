<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gutter Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Gutter Studio draws comic pages, manga, webtoon strips, square posts and storyboard sheets. Edit panels, characters, props, dialogue and colour.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231D1D1F'/%3E%3Crect x='8' y='11' width='3.5' height='10' rx='1' fill='white'/%3E%3Crect x='14.2' y='8' width='3.5' height='16' rx='1' fill='white'/%3E%3Crect x='20.4' y='13' width='3.5' height='6' rx='1' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/styles/index.css">
</head>
<body>
<div class="app" id="app">

 <header class="appbar" id="appbar">
  <h1 class="sr-only" id="docTitle">Gutter Studio</h1>
  <div class="brand">
   <span class="mark" aria-hidden="true"><span><i></i><i></i><i></i></span></span>
   <span class="wordmark">Gutter</span>
  </div>
  <button class="projectmenu" id="projBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Project menu">
   <span class="pname" id="projName">Gutter Studio</span>
  </button>
  <span class="divider-v hide-mobile" aria-hidden="true"></span>
  <div class="savechip" id="saveState" data-state="saved" role="status" aria-live="polite"></div>
  <span class="sp"></span>
  <div class="actions" id="histActions"></div>
  <span class="sp"></span>
  <div class="actions hide-mobile" id="viewActions"></div>
  <div class="actions" id="mainActions"></div>
 </header>

 <div class="ctxbar" id="ctxbar" role="toolbar" aria-label="Tool options"></div>

 <div class="work" id="work">
  <nav class="rail" id="rail" aria-label="Tools"></nav>
  <aside class="browser" id="browser" aria-label="Resources"></aside>
  <main class="canvas" id="canvas" aria-label="Page canvas">
   <div class="stage" id="stage" data-tool="select" tabindex="-1">
    <div class="sheetwrap" id="sheetwrap"></div>
   </div>
  </main>
  <aside class="inspector" id="inspector" aria-label="Properties"></aside>
 </div>

 <section class="pages" id="pages" aria-label="Pages"></section>
 <footer class="status" id="status" aria-label="Status"></footer>
 <div class="quickbar" id="quickbar" aria-label="Quick actions"></div>
 <nav class="nav" id="nav" aria-label="Sections"></nav>
</div>

<div id="layers"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./src/app/boot.js"></script>
</body>
</html>
